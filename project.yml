name: Streamlink
options:
  bundleIdPrefix: com.agartner
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Leave the team empty so anyone can select their own for sideloading.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_TESTABILITY: YES

targets:
  Streamlink:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Streamlink
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking needs all four orientations; without it the app is
        # treated as full-screen-only and gets a fixed-size window on macOS.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Direct HLS URLs may be plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # The debug server (Debug builds only) listens on the local network on devices.
        NSLocalNetworkUsageDescription: Lets development tools on your network connect to the debug server.
        NSBonjourServices:
          - _sldebug._tcp
    # Declared so the StreamlinkUIDriver scheme doesn't replace Xcode's autocreated one.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agartner.streamlink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Interactive UI driver (UIDriver/UIDriver.swift): an XCUITest that serves HTTP.
  StreamlinkUIDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UIDriver
    dependencies:
      - target: Streamlink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agartner.streamlinkUIDriver
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Streamlink
        # The runner app listens on the network on devices.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Lets development tools drive the app's UI.

schemes:
  StreamlinkUIDriver:
    build:
      targets:
        StreamlinkUIDriver: [test]
    test:
      targets:
        - StreamlinkUIDriver
